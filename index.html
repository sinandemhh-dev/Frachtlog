<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ohmlog</title>
<style>
:root{--ink:#111;--ink2:#333;--bg:#ececec;--card:#fff;--text:#111;--sub:#666;--line:#cfcfcf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:30px;width:auto}
header h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.5px}
#net{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;background:#fff;color:#111}
#net.off{background:#777;color:#fff}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--sub)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{margin-bottom:10px;position:relative}
.f label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px;font-weight:600}
.f input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font-size:16px;background:#f7f7f7;color:var(--text)}
.f input::placeholder{color:#a0a0a0}
.f input:focus{outline:none;border-color:var(--ink);background:#fff}
.f input[readonly]{background:#e6e6e6;color:#444}
.seg{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:12px 0;background:#f7f7f7;border:0;color:var(--text);font-size:15px;font-weight:700}
.seg button.on{background:var(--ink);color:#fff}
.err{border-color:#d00 !important}
.btn{width:100%;padding:15px;background:var(--ink);color:#fff;border:0;border-radius:9px;font-size:17px;font-weight:800}
.btn:active{background:var(--ink2)}
.e{border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}
.e:last-child{border:0}
.e .t{display:flex;justify-content:space-between;font-weight:700}
.e .m{color:var(--sub);font-size:13px;margin-top:2px}
.empty{color:var(--sub);text-align:center;padding:14px 0;font-size:14px}
#warn{display:none;background:#eee;border:1px solid #999;color:#111;padding:10px;border-radius:9px;margin-bottom:12px;font-size:13px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.sugg{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;max-height:220px;overflow-y:auto;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.2);margin-top:4px}
.sugg button{display:block;width:100%;padding:12px;border:0;border-bottom:1px solid var(--line);background:#fff;color:var(--text);font:inherit;font-size:15px;text-align:left;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button:active{background:#eee}
</style>
</head>
<body>

<main>
<div id="warn">Backend nicht verbunden: In der Datei index.html die Variable SCRIPT_URL eintragen.</div>

<div class="card"><h2>Fahrt</h2>
 <div class="row">
  <div class="f"><label>Fahrzeug Kennzeichen *</label><input id="fz" placeholder="HHOL1110" autocapitalize="characters" autocomplete="off"></div>
  <div class="f"><label>Fahrer *</label><input id="fa" placeholder="Name"></div>
 </div>
 <div class="row">
  <div class="f"><label>Datum *</label><input id="dt" type="date"></div>
  <div class="f"><label>Tag</label><input id="tg" readonly></div>
 </div>
 <div class="f"><label>Auftraggeber</label><input id="ag" value="LTH" readonly></div>
</div>

<div class="card"><h2>Fahrstrecke &amp; Container</h2>
 <div class="f"><label>Fahrtnummer *</label><input id="fn" value="1" readonly autocomplete="off"></div>
 <div class="f"><label>Auftragsnummer *</label><input id="an" placeholder="20-95625.002-1" autocomplete="off"></div>
 <div class="row">
  <div class="f"><label for="von">Von *</label><input id="von" autocomplete="off" placeholder="CTA / CTB …" autocapitalize="characters"><div id="von-sugg" class="sugg"></div></div>
  <div class="f"><label for="nach">Nach *</label><input id="nach" autocomplete="off" placeholder="PRAHL&amp;BARSOE / EDEKA …" autocapitalize="characters"><div id="nach-sugg" class="sugg"></div></div>
 </div>
 <div class="f"><label>Größe *</label>
  <div class="seg" id="sSize"><button data-v="20">20</button><button data-v="40">40</button><button data-v="45">45</button><button data-v="2x20">2×20</button></div>
 </div>
 <div class="f"><label id="l1">Containernummer *</label><input id="cn1" placeholder="TLLU 111.222-3" autocapitalize="characters" autocomplete="off"></div>
 <div class="f" id="box2" style="display:none"><label>Containernummer 2 *</label><input id="cn2" placeholder="TLLU 111.222-3" autocapitalize="characters" autocomplete="off"></div>
 <div class="f"><label>L / V *</label><div class="seg" id="sLV"><button data-v="L">Leer</button><button data-v="V">Voll</button></div></div>
 <div class="row">
  <div class="f"><label>Chassis Kennzeichen *</label><input id="ch" placeholder="HBHL111" autocapitalize="characters" autocomplete="off"></div>
  <div class="f"><label>Chassis A-Nummer *</label><input id="ca" placeholder="A11" autocapitalize="characters" autocomplete="off"></div>
 </div>
 <div class="f"><label>Probleme</label><input id="bm" placeholder="Wartezeit? / Bekleme?" autocomplete="off"></div>
 <button class="btn" id="save">Eintrag speichern</button>
</div>

<div class="card"><h2>Meine Einträge heute</h2><div id="list"><div class="empty">Noch keine Einträge</div></div></div>
</main>
<div id="toast"></div>

<script>
/* ====== HIER ANPASSEN ====== */
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyavOk8umQ7y6YAId48e5qo8FdbUiKI-8HD67oxama1cIH9m63rdMx4-EM8FvITvIgS/exec";
const SECRET="frachtlog-n7q4x2"; /* muss identisch mit SECRET im Apps-Script sein */
/* =========================== */
const $=id=>document.getElementById(id);
const TAGE=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const V={size:"",lv:""};
const SYNC_SCHEMA="ohmlog-app-fields-v2";
const SYNC_PROTOCOL="ohmlog-new-saves-v1";
const SYNC_QUEUE="fl_q_new_saves_v1";
function nextFahrtnummer(){
 const n=Number(ls.get("fl_next_fahrtnummer",1));
 return Number.isSafeInteger(n)&&n>0?n:1;
}
$("fn").value=String(nextFahrtnummer());
const LOCS=["BASTE&LANGE","BETTENDUSCHER","CCIS","CMR","CST","CTA","CTB","CTB DCC","CTT","DCC","DSV TCO","DUSS","EDEKA","EKOM","EUGS","FIEGE HCCR","FREUDENBERG HCCR","HCCR","HCS","HKL UCS","KRAUSELAGER CTB","KRAUSELAGER EUGS","KTH","LAGERHAUS","LTHCHASSIS","LTM","MEDREPAIR","MONDELEZ","NEUKIRCH MEDREPAIR","POCO REMAIN","POCO TWS","PRAHL&BARSOE","REMAIN","S&O","SCANGLOBAL","TANKFELD","TWS","UCS","UNIKAI","UNITAINER","VETI"];

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function esc(s){return String(s==null?"":s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]))}
function setTag(){const v=$("dt").value;$("tg").value=v?TAGE[new Date(v+"T12:00:00").getDay()]:""}
function setSeg(id,v){$(id).querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
function seg(id,key,cb){$(id).addEventListener("click",e=>{if(e.target.tagName!=="BUTTON")return;V[key]=e.target.dataset.v;setSeg(id,V[key]);$(id).classList.remove("err");if(cb)cb()})}
function onSize(){
 const two=V.size==="2x20";
 $("box2").style.display=two?"block":"none";
 $("l1").textContent=two?"Containernummer 1 *":"Containernummer *";
}

/* Vorschläge ab dem ersten Buchstaben; nur Einträge aus der Liste. */
function setupAC(id){
 const inp=$(id),box=$(id+"-sugg");
 function suggest(){
  const v=inp.value.trim().toUpperCase();
  if(v.length<1){box.style.display="none";return}
  const names=LOCS;
  const m=names.filter(l=>l.startsWith(v)).concat(names.filter(l=>!l.startsWith(v)&&l.includes(v))).slice(0,6);
  box.innerHTML=m.map(x=>`<button type="button" data-location="${esc(x)}">${esc(x)}</button>`).join("");
  box.style.display=m.length?"block":"none";
 }
 inp.addEventListener("input",suggest);
 inp.addEventListener("focus",suggest);
 inp.addEventListener("keydown",e=>{
  if(e.key==="Escape"||e.key==="Enter")box.style.display="none";
 });
 box.addEventListener("click",e=>{
  const option=e.target.closest("button[data-location]");
  if(!option||!box.contains(option))return;
  inp.value=option.dataset.location;inp.classList.remove("err");inp.setCustomValidity("");box.style.display="none";
 });
 document.addEventListener("click",e=>{if(e.target!==inp&&!box.contains(e.target))box.style.display="none"});
}
setupAC("von");setupAC("nach");

/* Kennzeichen: Leerzeichen entfernen, Großbuchstaben */
["fz","ch","ca"].forEach(id=>$(id).addEventListener("input",()=>{const el=$(id);const p=el.selectionStart;el.value=el.value.replace(/\s+/g,"").toUpperCase()}));
document.querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>{i.classList.remove("err");i.setCustomValidity("")}));

let dtTouched=false;
$("dt").value=today();setTag();
$("dt").addEventListener("input",()=>{dtTouched=true;setTag()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!dtTouched){$("dt").value=today();setTag()}});
["fz","fa","ca"].forEach(id=>{$(id).value=ls.get("fl_"+id,"")});
seg("sSize","size",onSize);seg("sLV","lv");
if(SCRIPT_URL.indexOf("HIER_")===0)$("warn").style.display="block";

function formatError(id,message){
 const el=$(id);el.classList.add("err");el.setCustomValidity(message);
 el.reportValidity();el.focus();toast(message);return false;
}
function validateFormats(){
 const checks=[
  ["ch",/^[A-ZÄÖÜ]{1,3}[A-Z]{1,2}[0-9]{2,4}$/, "Chassis Kennzeichen: Buchstaben und 2 bis 4 Ziffern, z. B. HBHL111"],
  ["fa",/^[\p{L}][\p{L}\p{M} .’'\-]{1,79}$/u, "Fahrer: Bitte einen Namen ohne Zahlen eingeben"],
  ["fn",/^[1-9][0-9]*$/, "Fahrtnummer muss eine positive ganze Zahl sein"],
  ["an",/^[0-9]{2}-[0-9]{5}\.[0-9]{3}-[0-9]+(\.[0-9]+)?$/, "Auftragsnummer: z. B. 20-95625.002-1 oder 20-95625.002-1.1"],
 ];
 for(const [id,re,message] of checks){$(id).value=$(id).value.trim();if(!re.test($(id).value))return formatError(id,message)}
 const date=$("dt").value;
 const parsed=new Date(date+"T12:00:00");
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(parsed.getTime())||parsed.getFullYear()!==Number(date.slice(0,4))||parsed.getMonth()+1!==Number(date.slice(5,7))||parsed.getDate()!==Number(date.slice(8,10)))return formatError("dt","Bitte ein gültiges Datum eingeben");
 for(const id of ["von","nach"]){
  const value=$(id).value.trim().toUpperCase();
  if(!LOCS.includes(value))return formatError(id,"Bitte einen Ort aus der Vorschlagsliste auswählen");
  $(id).value=value;
 }
 for(const id of (V.size==="2x20"?["cn1","cn2"]:["cn1"])){
  const value=$(id).value.trim().toUpperCase();
  if(!/^[A-Z]{3}[UJZ] ?[0-9]{3}\.?[0-9]{3}-?[0-9]$/.test(value))return formatError(id,"Containernummer: 4 Buchstaben (Endung U/J/Z) und 7 Ziffern, z. B. TLLU 111.222-3");
  const compact=value.replace(/[ .-]/g,"");
  $(id).value=compact.slice(0,4)+" "+compact.slice(4,7)+"."+compact.slice(7,10)+"-"+compact.slice(10);
 }
 if(V.size==="2x20"&&$("cn1").value===$("cn2").value)return formatError("cn2","Bitte zwei unterschiedliche Containernummern eingeben");
 if(!["20","40","45","2x20"].includes(V.size)||!["L","V"].includes(V.lv)){toast("Bitte Größe und L/V auswählen");return false}
 if($("bm").value.length>1000)return formatError("bm","Bemerkung: maximal 1000 Zeichen");
 return true;
}
function req(id){const el=$(id);const ok=el.value.trim()!=="";el.classList.toggle("err",!ok);return ok}
function reqSeg(id,v){$(id).classList.toggle("err",!v);return !!v}

$("save").addEventListener("click",()=>{
 let ok=true;
 ["fz","fa","dt","fn","an","von","nach","cn1","ch","ca"].forEach(id=>{if(!req(id))ok=false});
 const two=V.size==="2x20";
 if(two&&!req("cn2"))ok=false;
 if(!reqSeg("sSize",V.size))ok=false;
 if(!reqSeg("sLV",V.lv))ok=false;
 if(!ok){toast("Bitte alle Pflichtfelder ausfüllen");return}
 if(!validateFormats())return;
 const fz=$("fz").value.trim(),fa=$("fa").value.trim();
 ["fz","fa","ca"].forEach(id=>ls.set("fl_"+id,$(id).value.trim()));
 const ch=$("ch").value.trim(),ca=$("ca").value.trim();
 $("fn").value=String(nextFahrtnummer());
 const e={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),datum:$("dt").value,tag:$("tg").value,
  fahrzeug:fz,fahrer:fa,auftraggeber:"LTH",fahrtnr:$("fn").value.trim(),
  von:$("von").value.trim().toUpperCase(),nach:$("nach").value.trim().toUpperCase(),
  groesse:V.size,container1:$("cn1").value.trim().toUpperCase(),
  container2:two?$("cn2").value.trim().toUpperCase():"",
  lv:V.lv,chassis:ch,chassisANummer:ca,
  auftragsnummer:$("an").value.trim(),bemerkung:$("bm").value.trim(),sent:false,syncProtocol:SYNC_PROTOCOL};
 ls.set("fl_h",[e].concat(ls.get("fl_h",[])).slice(0,200));
 // Die alte Warteschlange bleibt unverändert gespeichert und wird nicht mehr übertragen.
 ls.set(SYNC_QUEUE,ls.get(SYNC_QUEUE,[]).concat([e]));
 ls.set("fl_next_fahrtnummer",Number(e.fahrtnr)+1);
 $("fn").value=String(nextFahrtnummer());
 ["an","von","nach","cn1","cn2","ch","bm"].forEach(id=>$(id).value="");
 $("von-sugg").style.display="none";$("nach-sugg").style.display="none";
 V.size="";V.lv="";setSeg("sSize","");setSeg("sLV","");onSize();
 dtTouched=false;$("dt").value=today();setTag();
 render();toast("Gespeichert");flush();
});

let busy=false,syncNoticeShown=false;
function syncUpdateNotice(){
 if(syncNoticeShown)return;
 syncNoticeShown=true;toast("Übertragung bitte aktualisieren. Eintrag bleibt auf diesem Gerät gespeichert.");
}
async function syncRequest(options){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),15000);
 try{
  const r=await fetch(SCRIPT_URL,Object.assign({},options,{signal:controller.signal}));
  if(!r.ok)throw new Error("Übertragung nicht erreichbar");
  return await r.json();
 }finally{clearTimeout(timer)}
}
async function flush(){
 if(busy||!navigator.onLine||SCRIPT_URL.indexOf("HIER_")===0)return;
 const batch=ls.get(SYNC_QUEUE,[]).filter(e=>e&&e.syncProtocol===SYNC_PROTOCOL).slice(0,5);if(!batch.length)return;
 busy=true;
 try{
  for(const e of batch){
   const j=await syncRequest({method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({},e,{secret:SECRET}))});
   if(!j||(j.status!=="ok"&&j.status!=="dup")){
    if(j&&j.code==="outdated-client")syncUpdateNotice();
    break;
   }
   const h=ls.get("fl_h",[]);h.forEach(x=>{if(x.id===e.id)x.sent=true});ls.set("fl_h",h);
   // Zwischenzeitlich gespeicherte Fahrten bleiben in der aktuellen Warteschlange.
   ls.set(SYNC_QUEUE,ls.get(SYNC_QUEUE,[]).filter(x=>x.id!==e.id));
  }
 }catch(error){}finally{busy=false;render()}
}
function render(){
 const h=ls.get("fl_h",[]).filter(e=>e.datum===today());
 $("list").innerHTML=h.length?h.map(e=>{
  const c=e.groesse==="2x20"?`${esc(e.container1)||"—"} + ${esc(e.container2)||"—"}`:`${esc(e.container1)||"—"}`;
  return `<div class="e"><div class="t"><span>${esc(e.von)||"—"} → ${esc(e.nach)||"—"}</span><span>${e.sent?"✓":"⏳"}</span></div>
  <div class="m">${e.fahrtnr?esc(e.fahrtnr)+" · ":""}${c} · ${esc(e.groesse)} · ${e.lv==="L"?"Leer":"Voll"}</div></div>`}).join(""):'<div class="empty">Noch keine Einträge</div>';
}
function net(){const n=$("net");n.textContent=navigator.onLine?"online":"offline";n.classList.toggle("off",!navigator.onLine)}
window.addEventListener("online",()=>{net();flush()});window.addEventListener("offline",net);
net();render();flush();setInterval(flush,30000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
